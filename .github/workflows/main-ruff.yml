name: Python simple web app with Flask and Ruff test with Github Actions
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.14.8
      - name: Install Dependencies using ruff
        run: |
          make install-ruff-alt
      - name: Format and Lint with Ruff
        run: |
          make ruff-format-lint
      - name: Test with Pytest
        run: |
          make test
